<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css">
<style>
.bg{position:absolute;inset:0;background:radial-gradient(80% 90% at 30% 40%,#F0453D 0%,#E8322B 50%,#B81F19 100%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:40px 40px}
.title{left:64px;top:46px;font-family:"Archivo";font-weight:900;font-stretch:66%;font-size:170px;line-height:.84;color:#fff;text-transform:uppercase;letter-spacing:-.015em}
.title span{color:#111}
.chat{left:64px;top:398px;width:470px;background:#111;border-radius:22px;padding:18px 20px 16px;transform:rotate(-2deg);box-shadow:0 22px 40px rgba(0,0,0,.35)}
.chat .who{display:flex;align-items:center;gap:10px;font:700 18px Inter,Arial;color:#fff;margin-bottom:12px}
.chat .who i{width:34px;height:34px;border-radius:50%;background:#C48C5B;display:grid;place-items:center;font:800 15px Inter;color:#fff;font-style:normal}
.chat .who small{font:500 13px Inter;color:#9a9a9a;display:block}
.chat .msg{display:inline-block;background:#2a2a2e;color:#fff;font:600 27px Inter,Arial;padding:12px 18px;border-radius:18px 18px 18px 4px}
.chat .seen{font:500 14px Inter;color:#9a9a9a;margin-top:8px;text-align:right}
.stamp{left:330px;top:356px;transform:rotate(7deg);font-size:34px}
.person{height:690px;width:694px;right:-30px;top:30px;filter:drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 -5px 0 #fff) drop-shadow(14px 14px 0 rgba(0,0,0,.5))}
</style></head><body><div class="thumb">
<div class="bg"></div><div class="grid"></div>
<div class="abs title">quase<br><span>perdi</span></div>
<div class="abs chat"><div class="who"><i>C</i><div>Cliente<small>online</small></div></div>
<div class="msg">vou pensar e te aviso…</div><div class="seen">visto às 21:14</div></div>
<div class="stamp">R$ 1.997</div>
<div class="person"><img src="assets/voce-cetico.png" style="width:100%;height:100%"></div>
</div></body></html>
