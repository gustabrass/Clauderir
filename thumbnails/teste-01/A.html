<style>
.bg{position:absolute;inset:0;background:
  radial-gradient(38% 55% at 82% 32%,rgba(217,119,87,.55) 0%,rgba(217,119,87,0) 70%),

.eq{left:356px;top:396px;font:900 120px "Archivo";color:#fff;text-shadow:0 0 30px rgba(255,255,255,.35)}
.note{left:70px;top:612px;font-size:46px;color:#F6C9B6;transform:rotate(-4deg)}
.arrow{left:395px;top:560px}
.person{height:770px;right:-70px;top:22px}

.person .rim{background:#FFB08F;transform:translate(7px,-3px);filter:blur(3px);opacity:.95}
.person .tint{background:linear-gradient(90deg,rgba(10,6,20,.55) 0%,rgba(10,6,20,.15) 45%,rgba(217,119,87,.25) 100%);mix-blend-mode:multiply}
.person img.photo{filter:contrast(1.12) brightness(.92) saturate(1.05)}
